    get:
      summary: Get credential by ID (with decrypted payload)
      description: |
        Retrieves a single credential entity by its UUID and parent project UUID, including its decrypted secret payload.
        Requires the vault to be unlocked.
      tags:
        - Credentials
      parameters:
        - name: project_id
          in: path
          description: Parent Project UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: credential_id
          in: path
          description: Credential UUID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential details and decrypted payload retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '400':
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Vault is locked, please unlock it first
          content:
            application/json:
