  /security/vault/unlock:
    post:
      summary: Unlock vault with master password
      description: Verifies master password and initializes the in-memory AES key session.
      tags:
        - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterPasswordRequest'
      responses:
        '200':
          description: Vault unlocked successfully
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Invalid payload or master password not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid master password or missing DEVAULTY_INTERNAL_TOKEN header
          content:
