openapi: 3.0.3
info:
  title: Devaulty API Documentation
  description: REST API for Devaulty Desktop App Engine
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Development Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: DEVAULTY_INTERNAL_TOKEN
      description: |
        Internal security token generated in memory per app lifecycle.
        Note: When running in DEV environment (APP_ENV=dev), this token defaults to 'dev-token' for interactive testing.

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid project ID"

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Project archived"

    Project:
      type: object
      required:
        - id
        - name
        - archived
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "06f891ae-368b-4bd6-b1e6-d957f1496f9a"
        name:
          type: string
          example: "Devaulty Go"
        description:
          type: string
          nullable: true
          example: "Developer Vault Application"
        icon:
          type: string
          nullable: true
          example: "rocket"
        color:
          type: string
          nullable: true
          example: "#4A90E2"
        archived:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-08-01T12:35:07.84097684-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-01T16:22:46.12345678-03:00"

    CreateProjectCommand:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "Devaulty Go"
        description:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          example: "Developer Vault Application"
        icon:
          type: string
          maxLength: 100
          nullable: true
          example: "rocket"
        color:
          type: string
          nullable: true
          pattern: "^#([A-Fa-f0-9]{3,4}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$"
          example: "#4A90E2"

    UpdateProjectCommand:
      type: object
      properties:
        name:
          type: string
          nullable: true
          example: "Updated Devaulty Name"
        description:
          type: string
          nullable: true
          example: "Updated Description"
        icon:
          type: string
          nullable: true
          example: "folder"
        color:
          type: string
          nullable: true
          example: "#00FF00"

    ProjectPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Project'
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    SnippetType:
      type: string
      enum:
        - COMMAND
        - CODE
      example: "CODE"

    SnippetLanguage:
      type: string
      enum:
        - BASH
        - FISH
        - ZSH
        - SH
        - POWERSHELL
        - BATCH
        - JAVA
        - KOTLIN
        - JAVASCRIPT
        - TYPESCRIPT
        - PYTHON
        - GO
        - RUST
        - C
        - CPP
        - CSHARP
        - PHP
        - RUBY
        - SWIFT
        - DART
        - SCALA
        - LUA
        - PERL
        - R
        - ELIXIR
        - HASKELL
        - CLOJURE
        - GROOVY
        - HTML
        - CSS
        - SCSS
        - LESS
        - JSX
        - TSX
        - VUE
        - SVELTE
        - JSON
        - YAML
        - XML
        - TOML
        - INI
        - ENV
        - CSV
        - MARKDOWN
        - PROPERTIES
        - DOCKERFILE
        - DOCKER_COMPOSE
        - NGINX
        - APACHE
        - TERRAFORM
        - ANSIBLE
        - KUBERNETES_YAML
        - HELM
        - MAKEFILE
        - CMAKE
        - GRADLE
        - MAVEN_POM
        - SQL
        - PLSQL
        - GRAPHQL
        - MONGODB
        - GITHUB_ACTIONS
        - GITLAB_CI
        - JENKINSFILE
        - REGEX
        - DIFF
        - LOG
        - PLAIN_TEXT
      example: "GO"

    Snippet:
      type: object
      required:
        - id
        - projectId
        - title
        - content
        - snippetType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "784f6f5c-57af-4313-b160-688a3e0d283b"
        projectId:
          type: string
          format: uuid
          example: "06f891ae-368b-4bd6-b1e6-d957f1496f9a"
        title:
          type: string
          example: "Print Hello World"
        description:
          type: string
          nullable: true
          example: "Simple print example in Go"
        content:
          type: string
          example: "fmt.Println(\"Hello World\")"
        language:
          $ref: '#/components/schemas/SnippetLanguage'
        snippetType:
          $ref: '#/components/schemas/SnippetType'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-03T12:35:07.84097684-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-03T16:22:46.12345678-03:00"

    CreateSnippetCommand:
      type: object
      required:
        - title
        - content
        - language
        - snippetType
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Print Hello World"
        description:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          example: "Simple print example in Go"
        content:
          type: string
          minLength: 1
          example: "fmt.Println(\"Hello World\")"
        language:
          $ref: '#/components/schemas/SnippetLanguage'
        snippetType:
          $ref: '#/components/schemas/SnippetType'

    UpdateSnippetCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          example: "Updated Snippet Title"
        description:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          example: "Updated description"
        content:
          type: string
          minLength: 1
          nullable: true
          example: "log.Println(\"Updated Content\")"
        language:
          $ref: '#/components/schemas/SnippetLanguage'
        snippetType:
          $ref: '#/components/schemas/SnippetType'

    SnippetPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Snippet'
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    Link:
      type: object
      required:
        - id
        - projectId
        - title
        - url
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "784f6f5c-57af-4313-b160-688a3e0d283b"
        projectId:
          type: string
          format: uuid
          example: "06f891ae-368b-4bd6-b1e6-d957f1496f9a"
        title:
          type: string
          example: "Go Documentation"
        url:
          type: string
          format: uri
          example: "https://go.dev/doc"
        description:
          type: string
          nullable: true
          example: "Official Go Documentation"
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-03T12:35:07.84097684-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-03T16:22:46.12345678-03:00"

    CreateLinkCommand:
      type: object
      required:
        - title
        - url
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Go Documentation"
        url:
          type: string
          format: uri
          example: "https://go.dev/doc"
        description:
          type: string
          nullable: true
          example: "Official Go Documentation"

    UpdateLinkCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Updated Go Documentation"
        url:
          type: string
          format: uri
          example: "https://go.dev/doc"
        description:
          type: string
          example: "Updated description"

    LinkPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Link'
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    ProblemStatus:
      type: string
      enum:
        - OPEN
        - WORKING_ON
        - RESOLVED
        - WONT_FIX
      example: "OPEN"

    ProblemSeverity:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      example: "HIGH"

    Problem:
      type: object
      required:
        - id
        - projectId
        - title
        - errorDescription
        - status
        - severity
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "24199dbd-36c4-43c6-aeb2-680155af8293"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "Database Connection Failure"
        errorDescription:
          type: string
          example: "Connection refused at localhost:5432"
        solution:
          type: string
          nullable: true
          example: "Restart PostgreSQL database container"
        status:
          $ref: '#/components/schemas/ProblemStatus'
        severity:
          $ref: '#/components/schemas/ProblemSeverity'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-05T19:29:23.61280878-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-05T21:07:31.992077709-03:00"

    ProblemSummary:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - severity
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "24199dbd-36c4-43c6-aeb2-680155af8293"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "Database Connection Failure"
        status:
          $ref: '#/components/schemas/ProblemStatus'
        severity:
          $ref: '#/components/schemas/ProblemSeverity'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-05T19:29:23.61280878-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-05T21:07:31.992077709-03:00"

    CreateProblemCommand:
      type: object
      required:
        - title
        - errorDescription
        - status
        - severity
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Database Connection Failure"
        errorDescription:
          type: string
          minLength: 2
          maxLength: 255
          example: "Connection refused at localhost:5432"
        solution:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          example: "Restart PostgreSQL database container"
        status:
          $ref: '#/components/schemas/ProblemStatus'
        severity:
          $ref: '#/components/schemas/ProblemSeverity'

    UpdateProblemCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Updated Problem Title"
        errorDescription:
          type: string
          minLength: 2
          maxLength: 255
          example: "Updated error details"
        solution:
          type: string
          minLength: 2
          maxLength: 255
          example: "Updated solution steps"
        severity:
          $ref: '#/components/schemas/ProblemSeverity'

    UpdateProblemStatusCommand:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ProblemStatus'

    ProblemSummaryPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProblemSummary'
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    Note:
      type: object
      required:
        - id
        - projectId
        - title
        - content
        - archived
        - tags
      properties:
        id:
          type: string
          format: uuid
          example: "784f6f5c-57af-4313-b160-688a3e0d283b"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "Meeting Notes"
        content:
          type: string
          example: "Discussed system architecture and hexagonal pattern."
        archived:
          type: boolean
          example: false
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    NoteSummary:
      type: object
      required:
        - id
        - projectId
        - title
        - archived
        - tags
      properties:
        id:
          type: string
          format: uuid
          example: "784f6f5c-57af-4313-b160-688a3e0d283b"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "Meeting Notes"
        archived:
          type: boolean
          example: false
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateNoteCommand:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Meeting Notes"
        content:
          type: string
          minLength: 1
          example: "Discussed system architecture and hexagonal pattern."

    UpdateNoteCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          example: "Updated Meeting Notes"
        content:
          type: string
          minLength: 1
          nullable: true
          example: "Updated content"

    NoteSummaryPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NoteSummary'
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    MasterPasswordRequest:
      type: object
      required:
        - masterPassword
      properties:
        masterPassword:
          type: string
          minLength: 8
          maxLength: 255
          example: "mySuperSecretPassword123"

    MasterPasswordSetupRequiredView:
      type: object
      required:
        - isRequired
      properties:
        isRequired:
          type: boolean
          example: true

    VaultStatusView:
      type: object
      required:
        - active
        - secondsLeft
      properties:
        active:
          type: boolean
          example: true
        secondsLeft:
          type: integer
          format: int64
          example: 895

    ItemType:
      type: string
      enum:
        - SNIPPET
        - LINK
        - PROBLEM
        - NOTE
        - CREDENTIAL
      example: "CREDENTIAL"

    TagSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "06f891ae-368b-4bd6-b1e6-d957f1496f9a"
        name:
          type: string
          example: "Go Backend"
        color:
          type: string
          nullable: true
          example: "#FF0000"

    Tag:
      type: object
      required:
        - id
        - projectId
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "06f891ae-368b-4bd6-b1e6-d957f1496f9a"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        name:
          type: string
          example: "Go Backend"
        color:
          type: string
          nullable: true
          example: "#FF0000"
        createdAt:
          type: string
          format: date-time
          example: "2026-08-05T19:29:23.61280878-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-05T21:07:31.992077709-03:00"

    CreateTagCommand:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 40
          example: "Go Backend"
        color:
          type: string
          nullable: true
          pattern: "^#([A-Fa-f0-9]{3,4}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$"
          example: "#FF0000"

    UpdateTagCommand:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          nullable: true
          example: "Updated Tag Name"
        color:
          type: string
          nullable: true
          pattern: "^#([A-Fa-f0-9]{3,4}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$"
          example: "#00FF00"

    CredentialSecretType:
      type: string
      enum:
        - LOGIN
        - API_KEY
        - RAW_TEXT
      example: "LOGIN"

    CreateCredentialCommand:
      type: object
      required:
        - title
        - secretType
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "My AWS Login"
        secretType:
          $ref: '#/components/schemas/CredentialSecretType'
        username:
          type: string
          nullable: true
          example: "admin@aws.com"
        password:
          type: string
          nullable: true
          example: "SuperSecretPassword123!"
        apiKey:
          type: string
          nullable: true
          example: "sk_test_123456789"
        rawTextContent:
          type: string
          nullable: true
          example: "pem_certificate_content"
        notes:
          type: string
          nullable: true
          example: "Main AWS root account"
        relatedUrl:
          type: string
          nullable: true
          example: "https://aws.amazon.com"

    UpdateCredentialCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          example: "Updated AWS Title"
        secretType:
          $ref: '#/components/schemas/CredentialSecretType'
        username:
          type: string
          nullable: true
          example: "updated_admin"
        password:
          type: string
          nullable: true
          example: "NewPassword123!"
        apiKey:
          type: string
          nullable: true
          example: "new_sk_test_999"
        rawTextContent:
          type: string
          nullable: true
          example: "new_raw_content"
        notes:
          type: string
          nullable: true
          example: "Updated notes"
        relatedUrl:
          type: string
          nullable: true
          example: "https://new-url.com"

    CredentialSummaryView:
      type: object
      required:
        - id
        - projectId
        - title
        - secretType
        - tags
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "81e5768c-2598-4e37-a08d-013e7f4ca48d"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "My AWS Login"
        secretType:
          $ref: '#/components/schemas/CredentialSecretType'
        relatedUrl:
          type: string
          nullable: true
          example: "https://aws.amazon.com"
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-13T19:30:25.081066457-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-13T20:15:00.123456789-03:00"

    CredentialView:
      type: object
      required:
        - id
        - projectId
        - title
        - secretType
        - decryptedPayload
        - tags
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "81e5768c-2598-4e37-a08d-013e7f4ca48d"
        projectId:
          type: string
          format: uuid
          example: "70d68fba-be62-46bb-8e6c-e4c4b6912e91"
        title:
          type: string
          example: "My AWS Login"
        secretType:
          $ref: '#/components/schemas/CredentialSecretType'
        decryptedPayload:
          type: object
          additionalProperties:
            type: string
          example:
            username: "admin@aws.com"
            password: "SuperSecretPassword123!"
        notes:
          type: string
          nullable: true
          example: "Main AWS root account"
        relatedUrl:
          type: string
          nullable: true
          example: "https://aws.amazon.com"
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-13T19:30:25.081066457-03:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-13T20:15:00.123456789-03:00"

    CredentialSummaryPage:
      type: object
      required:
        - content
        - size
        - number
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSummaryView'
        size:
          type: integer
