  /projects/{project_id}/credentials:
    post:
      summary: Create a new credential in a project
      description: |
        Creates and encrypts a new credential for the specified project.
        The secret payload is encrypted at-rest using AES-256-GCM authenticated with AAD binding (project_id + credential_id).
        Requires the vault to be unlocked.
      tags:
        - Credentials
      parameters:
        - name: project_id
          in: path
          description: Parent Project UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialCommand'
      responses:
        '201':
          description: Credential created and encrypted successfully
          headers:
            Location:
              schema:
                type: string
              description: Relative URL path to the newly created credential
              example: "/api/v1/projects/70d68fba-be62-46bb-8e6c-e4c4b6912e91/credentials/81e5768c-2598-4e37-a08d-013e7f4ca48d"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '400':
          description: Invalid JSON payload, validation constraint failure, or missing required secret fields per secretType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Vault is locked, please unlock it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Master password not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Get paginated list of credential summaries for a project
      description: |
        Fetches a paginated list of credential summaries for the specified project ordered by creation date descending.
        For security, summaries do NOT contain decrypted secret payloads.
      tags:
        - Credentials
      parameters:
        - name: project_id
          in: path
          description: Parent Project UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Zero-based page index
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Page size limit
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
