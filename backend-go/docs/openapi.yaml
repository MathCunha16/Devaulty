        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update credential (Partial Update)
      description: |
        Performs a partial update on a credential entity.
        If title or metadata fields are passed without secret payload fields, metadata is updated and existing encrypted payload is preserved.
        If new secret payload fields are passed, the secret payload is re-encrypted with AES-256-GCM.
      tags:
        - Credentials
      parameters:
        - name: project_id
          in: path
          description: Parent Project UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: credential_id
          in: path
          description: Credential UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialCommand'
      responses:
        '200':
          description: Credential updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '400':
          description: Invalid JSON format or validation constraints failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Vault is locked, please unlock it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Master password not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project or Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

