name: Release CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.6)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ===========================================
  # STAGE 0: Go Tests & Version Sanity Check
  # ===========================================
  verify:
    name: Run Go Tests & Verify Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run Go Backend Tests
        working-directory: ./backend
        run: go test ./... -v

      - name: Verify Tag Matches Package Version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(jq -r '.version' frontend/package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag version matches package.json version: $TAG_VERSION"

  # ===========================================
  # STAGE 1: Linux Packaging (.deb, .rpm, .AppImage)
  # ===========================================
  build-linux:
    name: Package Linux Installers (.deb, .rpm, .AppImage)
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm dpkg-dev

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Linux Installers via Tauri
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build-all.js
          npx tauri build --bundles appimage,deb,rpm

      - name: Upload Linux Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error

  # ===========================================
  # STAGE 2: Windows Packaging (.msi, .nsis)
  # ===========================================
  build-windows:
    name: Package Windows Installer (.msi, .nsis)
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Windows Installer via Tauri
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build-all.js
          npx tauri build --bundles nsis

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  # ===========================================
  # STAGE 3: macOS Packaging (.dmg, .app)
  # ===========================================
  build-macos:
    name: Package macOS Installer (.dmg, .app)
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build macOS Installer via Tauri
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build-all.js
          npx tauri build --bundles dmg,app

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*
          if-no-files-found: error

  # ===========================================
  # STAGE 4: Publish on GitHub Releases
  # ===========================================
  publish-release:
    name: Publish GitHub Release Assets
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten and Display Collected Release Assets
        run: |
          echo "=== Flattening and Collecting Release Assets ==="
          find release-assets/ -type f -exec mv {} release-assets/ \;
          ls -la release-assets/

      - name: Generate latest.json Manifest for Tauri Updater
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node frontend/scripts/generate-latest-json.js release-assets "$RELEASE_TAG"

      - name: Publish GitHub Release (softprops/action-gh-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sig
            release-assets/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}